name: GPU Monitor 2

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run monitor2
        env:
          GPUSHARE_TOKEN: ${{ secrets.GPUSHARE_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python monitor2.py
      - name: Commit state
        run: |
          git config user.name "gpu-monitor"
          git config user.email "monitor@users.noreply.github.com"
          git add last_state2.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "update state2"
          git push
